schema_version: 1
features:
  audio_enabled: false
app:
  timezone: Asia/Bangkok
  default_model: gemini-3.1-flash-lite
  max_posts_per_topic: 20
  request_timeout_seconds: 20
  max_retries: 3
ai:
  max_output_tokens: 8192
  batch_size: 4
  max_output_retries: 1
  source_only_fallback: true
alert:
  enabled: true
  relevance_threshold: 0.75
  generate_audio: false
  catchup_hours: 168
  catchup_posts_per_run: 3
briefing:
  enabled: true
  reporting_hours: 24
  generate_audio: false
  max_summary_words: 500
tts:
  voice: th-TH-PremwadeeNeural
  rate: '+0%'
topics:
  - id: ai_tech
    name: AI Ecosystem
    enabled: true
    keywords:
      - AI model releases and research
      - open-source AI and open-weight models
      - AI agents and developer tools
      - AI inference and hardware
      - multimodal AI for image audio video and robotics
      - AI safety policy and licensing
      - API limits and product changes
      - Tibo and Logan Kilpatrick
    context: >
      ติดตามข่าว AI ที่มีสาระต่อผู้ใช้และนักพัฒนาจากทุกผู้ให้บริการและชุมชน
      ครอบคลุมการเปิดตัวโมเดลและงานวิจัย โมเดล open-weight และ open-source
      เอเจนต์และเครื่องมือนักพัฒนา การรันโมเดล ชิปและโครงสร้างพื้นฐาน
      ภาพ เสียง วิดีโอ หุ่นยนต์ ความปลอดภัย ลิขสิทธิ์ และนโยบาย
      แยก open-weight จาก open-source ตามหลักฐานเรื่องโค้ดและใบอนุญาต
      ติดตามการเปลี่ยนผลิตภัณฑ์ API และโควตา รวมข่าวจาก Tibo และ
      Logan Kilpatrick เมื่อแหล่งข่าวระบุตัวบุคคลชัดเจน
      คัดข่าวซ้ำหรือข่าวที่เป็นเพียงโฆษณาออกเมื่อหลักฐานไม่พอ
      ระบุชื่อโมเดล ผู้ให้บริการ วันที่ และแหล่งข่าวตามข้อมูลที่พบจริง
    telegram:
      message_thread_id: 5
    rss_urls:
