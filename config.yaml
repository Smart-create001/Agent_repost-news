schema_version: 1
app:
  timezone: Asia/Bangkok
  default_model: gemini-3.1-flash-lite
  max_posts_per_topic: 20
  request_timeout_seconds: 20
  max_retries: 3
alert:
  enabled: true
  relevance_threshold: 0.75
  generate_audio: false
briefing:
  enabled: true
  reporting_hours: 24
  generate_audio: true
  max_summary_words: 500
tts:
  voice: th-TH-PremwadeeNeural
  rate: '+0%'
topics:
  - id: ai_tech
    name: AI Models and Policy
    enabled: true
    keywords:
      - AI model launch
      - OpenAI
      - Google Gemini
      - Anthropic Claude
      - AI policy
      - API token quota reset
      - Tibo
      - Logan Kilpatrick
    context: >
      ติดตามการเปิดตัวโมเดล AI ใหม่ การเปลี่ยนนโยบายของผู้ให้บริการ
      และข่าวหรือโพสต์เกี่ยวกับการรีเซ็ตโควตา token หรือ API โดยเฉพาะ
      ข้อมูลจาก Tibo และ Logan Kilpatrick หากแหล่งข่าวระบุตัวบุคคลชัดเจน
      ระบุชื่อโมเดล ผู้ให้บริการ วันที่ประกาศ และแหล่งข่าวตามข้อมูลที่พบจริง
      หากคำว่า reset หมายถึงเรื่องอื่นหรือข้อมูลยังไม่ยืนยัน ให้ระบุความไม่แน่นอน
    telegram:
      message_thread_id: 5
    rss_urls:
      - 'https://news.google.com/rss/search?q=OpenAI%20OR%20Google%20Gemini%20OR%20Anthropic%20AI%20model%20launch%20policy&hl=en-US&gl=US&ceid=US:en'
      - 'https://news.google.com/rss/search?q=%22Tibo%22%20OR%20%22Logan%20Kilpatrick%22%20AI%20token%20reset%20API&hl=en-US&gl=US&ceid=US:en'
  - id: gold_price
    name: Gold Price
    enabled: true
    keywords:
      - ราคาทอง
      - gold price
      - spot gold
      - Thai gold price
    context: >
      ติดตามข่าวการเปลี่ยนแปลงราคาทองโลกและราคาทองไทย
      แยกประเภท spot gold กับราคาทองในประเทศ ระบุสกุลเงิน หน่วยราคา
      เวลาและวันที่ของข้อมูลเมื่อมีในแหล่งข่าว ห้ามแต่งราคาปัจจุบัน
      หรือใช้ราคาจากข่าวเก่าแทนราคาล่าสุด
    telegram:
      message_thread_id: 6
    rss_urls:
      - 'https://news.google.com/rss/search?q=%E0%B8%A3%E0%B8%B2%E0%B8%84%E0%B8%B2%E0%B8%97%E0%B8%AD%E0%B8%87%20OR%20gold%20price%20Thailand&hl=th&gl=TH&ceid=TH:th'
      - 'https://news.google.com/rss/search?q=spot%20gold%20price%20market&hl=en-US&gl=US&ceid=US:en'
