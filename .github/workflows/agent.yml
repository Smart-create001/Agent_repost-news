name: Social listening agent

on:
  schedule:
    - cron: '15 */2 * * *' # Alert, every two hours (UTC)
    - cron: '25 0 * * *'   # Briefing, 07:25 Asia/Bangkok
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        type: choice
        options: [alert, briefing, verify_state]
      phase6_test:
        description: Limit live briefing test to one text and one audio per topic
        required: false
        type: boolean
        default: false
      phase6_topic:
        description: Topic for a bounded alert test
        required: false
        type: choice
        default: ai_tech
        options: [ai_tech, gold_price]

permissions:
  contents: write

concurrency:
  group: agent-state-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run:
    if: vars.AGENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate state before run
        run: python -c 'from src.state import load_state; load_state("seen_posts.json")'
      - name: Capture alert candidates before processing
        if: (github.event_name == 'schedule' && github.event.schedule != '25 0 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'alert' && inputs.phase6_test != true)
        id: capture
        shell: bash
        run: |
          set +e
          python -m src.main --mode alert --capture-pending 2>&1 | tee "$RUNNER_TEMP/agent-capture.log"
          capture_exit=${PIPESTATUS[0]}
          echo "exit_code=$capture_exit" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist captured candidates
        if: steps.capture.outcome == 'success'
        id: persist_capture
        shell: bash
        run: |
          bash scripts/persist_state.sh
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run agent
        id: agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '25 0 * * *' && 'briefing' || 'alert') }}
          PHASE6_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.phase6_test || false }}
          PHASE6_TOPIC: ${{ inputs.phase6_topic || 'ai_tech' }}
          PERSISTED_COMMIT: ${{ steps.persist_capture.outputs.commit }}
        shell: bash
        run: |
          set +e
          if [[ "$RUN_MODE" == "verify_state" ]]; then
            python -m scripts.phase6_test --verify-state 2>&1 | tee "$RUNNER_TEMP/agent-dashboard.log"
            agent_exit=${PIPESTATUS[0]}
          elif [[ "$PHASE6_TEST" == "true" ]]; then
            if [[ "$RUN_MODE" == "alert" ]]; then
              python -m scripts.phase6_test --text-only --topic "$PHASE6_TOPIC" 2>&1 | tee "$RUNNER_TEMP/agent-dashboard.log"
              agent_exit=${PIPESTATUS[0]}
            elif [[ "$RUN_MODE" == "briefing" ]]; then
              python -m scripts.phase6_test 2>&1 | tee "$RUNNER_TEMP/agent-dashboard.log"
              agent_exit=${PIPESTATUS[0]}
            else
              echo 'Phase 6 test requires alert or briefing mode' >&2
              agent_exit=2
            fi
          else
            if [[ "$RUN_MODE" == "alert" ]]; then
              python -m src.main --mode alert --process-pending --persisted-commit "$PERSISTED_COMMIT" 2>&1 | tee "$RUNNER_TEMP/agent-dashboard.log"
            else
              python -m src.main --mode "$RUN_MODE" 2>&1 | tee "$RUNNER_TEMP/agent-dashboard.log"
            fi
            agent_exit=${PIPESTATUS[0]}
          fi
          echo "exit_code=$agent_exit" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist state
        id: persist
        run: bash scripts/persist_state.sh
      - name: Preserve state for reconciliation
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: state-for-reconciliation-${{ github.run_id }}
          path: seen_posts.json
          if-no-files-found: error
          retention-days: 30
      - name: Create status dashboard
        if: always()
        env:
          AGENT_EXIT: ${{ steps.agent.outputs.exit_code }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '25 0 * * *' && 'briefing' || 'alert') }}
        run: python scripts/dashboard.py --log "$RUNNER_TEMP/agent-dashboard.log" --state seen_posts.json --html "$RUNNER_TEMP/dashboard.html" --summary "$GITHUB_STEP_SUMMARY"
      - name: Save dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.run_id }}
          path: ${{ runner.temp }}/dashboard.html
          if-no-files-found: warn
          retention-days: 30
      - name: Report agent failure
        if: always()
        env:
          AGENT_EXIT: ${{ steps.agent.outputs.exit_code }}
        shell: bash
        run: |
          if [[ "$AGENT_EXIT" != "0" ]]; then
            echo "Agent exited with status $AGENT_EXIT" >&2
            exit 1
          fi
      - name: Report capture failure
        if: always() && steps.capture.outcome == 'success'
        env:
          CAPTURE_EXIT: ${{ steps.capture.outputs.exit_code }}
        shell: bash
        run: |
          if [[ "$CAPTURE_EXIT" != "0" ]]; then
            echo "Capture exited with status $CAPTURE_EXIT; see agent-capture.log" >&2
            exit 1
          fi
