name: Review previous status summary
on:
  workflow_dispatch:
permissions:
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-42131117959
          run-id: 42131117959
          github-token: ${{ github.token }}
          path: /tmp/prior-dashboard
      - name: Read aggregate status
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          class Cards(HTMLParser):
              def __init__(self): super().__init__(); self.capture=False; self.parts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='article': self.capture=True
              def handle_endtag(self,tag):
                  if tag=='article':
                      self.capture=False
                      print('::notice::'+ ' '.join(self.parts));self.parts=[]
              def handle_data(self,data):
                  if self.capture: self.parts.append(data.strip())
          Cards().feed(open('/tmp/prior-dashboard/dashboard.html',encoding='utf-8').read())
          PY
