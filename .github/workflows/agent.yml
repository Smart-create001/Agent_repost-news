name: Gemini API diagnosis
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Authorized live alert test with labeled Telegram messages
        required: true
        type: choice
        options: [alert, briefing]
      expected_chat_id:
        description: Optional chat ID from the user-supplied link for a boolean comparison only
        required: false
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Offline regression
        run: python -m pytest tests/test_brain.py tests/test_diagnose_rest.py tests/test_pipeline.py tests/test_notifier.py -q
      - name: TTS-only failure diagnosis
        run: python -m scripts.phase6_tts_probe
      - name: Preserve diagnostic delivery state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-state-${{ github.run_id }}
          path: diagnostic-output/
          if-no-files-found: ignore
          retention-days: 7
