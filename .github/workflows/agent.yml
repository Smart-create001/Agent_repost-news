name: Diagnose previous production run
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Summarize prior job errors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Smart-create001/Agent_repost-news/actions/jobs/127607684132/logs > /tmp/prior-run.log
          python3 - <<'PY'
          import re
          from collections import Counter
          lines=open('/tmp/prior-run.log',encoding='utf-8').read().splitlines()
          counts=Counter()
          for line in lines:
              topic=re.search(r'topic=([A-Za-z0-9_-]+)',line)
              topic=topic.group(1) if topic else 'unknown'
              if 'feed_errors=' in line: counts[(topic,'feed errors')]+=1
              if 'batch_start=' in line and 'failed=' in line: counts[(topic,'Gemini batch failure')]+=1
              if 'quarantined=' in line: counts[(topic,'quarantined output')]+=1
              if 'delivery_failed=1' in line: counts[(topic,'Telegram delivery failure')]+=1
              if 'topic=' in line and 'failed=' in line and 'batch_start=' not in line and 'delivery_failed=' not in line: counts[(topic,'topic failure')]+=1
          for (topic,kind),count in sorted(counts.items()): print(f'::notice::topic={topic} category={kind} count={count}')
          if not counts: print('::warning::No classified error events found')
          PY
