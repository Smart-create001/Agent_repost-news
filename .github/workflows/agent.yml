name: Verify isolated conflict recovery
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/state-race-data
      - uses: actions/download-artifact@v4
        with:
          name: race-state-42044051152
          run-id: 42044051152
          github-token: ${{ github.token }}
          path: recovered
      - name: Verify both isolated results
        run: |
          python3 - <<'PY'
          import json
          with open('phase7-race-state.json') as f: accepted=json.load(f)
          with open('recovered/phase7-race-state.json') as f: rejected=json.load(f)
          assert accepted == {'schema_version': 1, 'writers': ['42044051082']}
          assert rejected == {'schema_version': 1, 'writers': ['42044051152']}
          print('::notice::Accepted and rejected writer states both verified; no merge was performed.')
          PY
