name: X profile connectivity diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check public X profile
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          import httpx
          from src.scraper import parse_x_profile
          url = 'https://x.com/thsottiaux'
          try:
              response = httpx.get(url, timeout=30, follow_redirects=True, headers={'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36', 'Accept': 'text/html'})
              print('HTTP status:', response.status_code)
              response.raise_for_status()
          except Exception as exc:
              status = getattr(getattr(exc, 'response', None), 'status_code', 'none')
              print(f'::error::X request failed type={type(exc).__name__} status={status}', flush=True)
              raise
          if response.url.host != 'x.com':
              raise RuntimeError('Unexpected redirect')
          try:
              posts = parse_x_profile(response.text, 'thsottiaux', now=datetime.now(timezone.utc), max_age=timedelta(days=2))
          except Exception as exc:
              print(f'::error::X parse failed type={type(exc).__name__}: {exc}', flush=True)
              raise
          print('Recent posts parsed:', len(posts))
          if not posts:
              raise RuntimeError('No recent posts to validate')
          PY
