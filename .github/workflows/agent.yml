name: Public X feed diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public feeds
        run: |
          python - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET
          for url in ('https://rsshub.app/twitter/user/thsottiaux', 'https://nitter.net/thsottiaux/rss'):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      data = response.read(2000000)
                      root = ET.fromstring(data)
                      count = len(root.findall('.//item')) + len(root.findall('.//{http://www.w3.org/2005/Atom}entry'))
                      print(f'::notice::{url} status={response.status} entries={count}')
              except Exception as exc:
                  print(f'::warning::{url} failed type={type(exc).__name__} status={getattr(exc, "code", "none")}')
          PY
