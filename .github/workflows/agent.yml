name: Social listening agent
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnostic mode
        required: true
        type: choice
        options: [alert, briefing, verify_state]
      phase6_test:
        description: Unused
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Diagnose AI response without delivery or state writes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m scripts.diagnose_ai
