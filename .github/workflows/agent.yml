name: Social listening agent

on:
  schedule:
    - cron: '15 */2 * * *' # Alert, every two hours (UTC)
    - cron: '25 0 * * *'   # Briefing, 07:25 Asia/Bangkok
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        type: choice
        options: [alert, briefing, verify_state]
      phase6_test:
        description: Limit live briefing test to one text and one audio per topic
        required: false
        type: boolean
        default: false
      phase6_topic:
        description: Topic for a bounded alert test
        required: false
        type: choice
        default: ai_tech
        options: [ai_tech, gold_price]
      capture_only:
        description: Capture and persist pending AI candidates without Gemini or Telegram
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: agent-state-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run:
    if: vars.AGENT_ENABLED == 'true'
    outputs:
      persisted_commit: ${{ steps.verify_capture.outputs.persisted_commit }}
      state_sha256: ${{ steps.verify_capture.outputs.state_sha256 }}
      processing_outcome: ${{ steps.agent.outcome }}
      capture_only: ${{ steps.resolve_mode.outputs.capture_only }}
      capture_outcome: ${{ steps.capture.outcome }}
      persist_capture_outcome: ${{ steps.persist_capture.outcome }}
      remote_verification_outcome: ${{ steps.verify_capture.outcome }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate state before run
        run: python -c 'from src.state import load_state; load_state("seen_posts.json")'
      - name: Resolve capture-only mode
        id: resolve_mode
        env:
          CAPTURE_ONLY_INPUT: ${{ inputs.capture_only }}
          PENDING_QUEUE_CAPTURE_ONLY: ${{ vars.PENDING_QUEUE_CAPTURE_ONLY }}
        run: python -m scripts.gate2_mode
      - name: Capture alert candidates before processing
        if: success() && (steps.resolve_mode.outputs.capture_only == 'true' || (github.event_name == 'schedule' && github.event.schedule != '25 0 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'alert' && inputs.phase6_test != true))
        id: capture
        shell: bash
        run: |
          set +e
          python -m src.main --mode alert --capture-pending 2>&1 | tee "$RUNNER_TEMP/agent-capture.log"
          capture_exit=${PIPESTATUS[0]}
          echo "exit_code=$capture_exit" >> "$GITHUB_OUTPUT"
          exit "$capture_exit"
      - name: Persist captured candidates
        if: steps.capture.outcome == 'success'
        id: persist_capture
        shell: bash
        run: |
          bash scripts/persist_state.sh
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify captured state on remote
        if: steps.persist_capture.outcome == 'success'
        id: verify_capture
        env:
          PERSISTED_COMMIT: ${{ steps.persist_capture.outputs.commit }}
        shell: bash
        run: |
          python -c 'import os; from src.persistence import verify_remote_state; verify_remote_state("seen_posts.json", os.environ["PERSISTED_COMMIT"])'
          state_hash=$(git show "$PERSISTED_COMMIT:seen_posts.json" | sha256sum | cut -d ' ' -f 1)
          test -n "$state_hash"
          echo "persisted_commit=$PERSISTED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "state_sha256=$state_hash" >> "$GITHUB_OUTPUT"
      - name: Persist validated partial capture for reconciliation
        if: failure() && steps.capture.outcome == 'failure'
        id: persist_partial
        run: |
          python -c 'from src.state import load_state; load_state("seen_posts.json")'
          bash scripts/persist_state.sh
      - name: Run agent
        if: success() && steps.resolve_mode.outputs.capture_only == 'false' && (steps.capture.outcome == 'skipped' || steps.verify_capture.outcome == 'success')
        id: agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '25 0 * * *' && 'briefing' || 'alert') }}
          PHASE6_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.phase6_test || false }}
          PHASE6_TOPIC: ${{ inputs.phase6_topic || 'ai_tech' }}
          PERSISTED_COMMIT: ${{ steps.persist_capture.outputs.commit }}
        shell: bash
        run: |
          set +e
          if [[ "$RUN_MODE" == "verify_state" ]]; then
            python -m scripts.phase6_test --verify-state 2>&1 | tee "$RUNNER_TEMP/agent-dashboard.log"
            agent_exit=${PIPESTATUS[0]}
          elif [[ "$PHASE6_TEST" == "true" ]]; then
            if [[ "$RUN_MODE" == "alert" ]]; then
              python -m scripts.phase6_test --text-only --topic "$PHASE6_TOPIC" 2>&1 | tee "$RUNNER_TEMP/agent-dashboard.log"
              agent_exit=${PIPESTATUS[0]}
            elif [[ "$RUN_MODE" == "briefing" ]]; then
              python -m scripts.phase6_test 2>&1 | tee "$RUNNER_TEMP/agent-dashboard.log"
              agent_exit=${PIPESTATUS[0]}
            else
              echo 'Phase 6 test requires alert or briefing mode' >&2
              agent_exit=2
            fi
          else
            if [[ "$RUN_MODE" == "alert" ]]; then
              python -m src.main --mode alert --process-pending --persisted-commit "$PERSISTED_COMMIT" 2>&1 | tee "$RUNNER_TEMP/agent-dashboard.log"
            else
              python -m src.main --mode "$RUN_MODE" 2>&1 | tee "$RUNNER_TEMP/agent-dashboard.log"
            fi
            agent_exit=${PIPESTATUS[0]}
          fi
          echo "exit_code=$agent_exit" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist state
        id: persist
        run: bash scripts/persist_state.sh
      - name: Preserve state for reconciliation
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: state-for-reconciliation-${{ github.run_id }}
          path: seen_posts.json
          if-no-files-found: error
          retention-days: 30
      - name: Create status dashboard
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          PARTIAL_PERSIST_OUTCOME: ${{ steps.persist_partial.outcome }}
          AGENT_EXIT: ${{ steps.agent.outputs.exit_code }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '25 0 * * *' && 'briefing' || 'alert') }}
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/agent-capture.log" ]]; then
            cat "$RUNNER_TEMP/agent-capture.log" >> "$RUNNER_TEMP/agent-dashboard.log"
          fi
          python scripts/dashboard.py --log "$RUNNER_TEMP/agent-dashboard.log" --state seen_posts.json --html "$RUNNER_TEMP/dashboard.html" --summary "$GITHUB_STEP_SUMMARY"
      - name: Save dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.run_id }}
          path: ${{ runner.temp }}/dashboard.html
          if-no-files-found: warn
          retention-days: 30
      - name: Report agent failure
        if: always() && steps.agent.outcome != 'skipped'
        env:
          AGENT_EXIT: ${{ steps.agent.outputs.exit_code }}
        shell: bash
        run: |
          if [[ "$AGENT_EXIT" != "0" ]]; then
            echo "Agent exited with status $AGENT_EXIT" >&2
            exit 1
          fi
      - name: Report capture failure
        if: always() && steps.capture.outcome == 'failure'
        env:
          CAPTURE_EXIT: ${{ steps.capture.outputs.exit_code }}
        shell: bash
        run: |
          echo "Capture exited with status $CAPTURE_EXIT; processing was skipped" >&2
          exit 1
  verify-capture-only:
    if: needs.run.result == 'success' && needs.run.outputs.capture_only == 'true' && needs.run.outputs.capture_outcome == 'success' && needs.run.outputs.persist_capture_outcome == 'success' && needs.run.outputs.remote_verification_outcome == 'success' && needs.run.outputs.processing_outcome == 'skipped'
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Read persisted pending queue on a fresh runner
        env:
          EXPECTED_COMMIT: ${{ needs.run.outputs.persisted_commit }}
          EXPECTED_SHA256: ${{ needs.run.outputs.state_sha256 }}
          PROCESSING_OUTCOME: ${{ needs.run.outputs.processing_outcome }}
        run: |
          python -m scripts.verify_pending_snapshot \
            --expected-commit "$EXPECTED_COMMIT" \
            --expected-sha256 "$EXPECTED_SHA256" \
            --processing-outcome "$PROCESSING_OUTCOME"
