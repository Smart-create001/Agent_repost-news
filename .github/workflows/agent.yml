name: Facebook group public access diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check public group page
        run: |
          python - <<'PY'
          import urllib.request
          url = 'https://www.facebook.com/groups/4157162401260703/'
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=25) as response:
                  body = response.read(2000000).decode('utf-8', errors='replace').lower()
                  indicators = {k: body.count(k) for k in ('login', 'comet_sections', 'story_message', 'creation_time', 'feedback_context', 'groups/4157162401260703/posts/', 'groups/4157162401260703/permalink/', 'openaI codex'.lower(), 'content not found')}
                  print(f'::warning::Facebook status={response.status} bytes={len(body)} indicators={indicators}', flush=True)
          except Exception as exc:
              print(f'::error::Facebook request failed type={type(exc).__name__} status={getattr(exc, "code", "none")}', flush=True)
              raise
          PY
