name: Editorial validation only
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Editorial probe only
        required: true
        type: choice
        options: [alert, briefing, verify_state]
      phase6_test:
        description: Unused by the editorial probe
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/ -q
      - name: Editorial probe without delivery or state writes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m scripts.editorial_probe
      - name: Preserve editorial review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-review-${{ github.run_id }}
          path: editorial-review/
          if-no-files-found: ignore
          retention-days: 7
