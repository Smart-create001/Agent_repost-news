name: Facebook RSS source diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check RSSHub Facebook group feed
        run: |
          python - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET
          url='https://rsshub.app/facebook/group/4157162401260703'
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'}), timeout=35) as response:
                  data=response.read(2000000)
                  root=ET.fromstring(data)
                  items=root.findall('.//item')
                  print(f'::warning::RSS status={response.status} root={root.tag} entries={len(items)}',flush=True)
                  for item in items[:2]:
                      print('::warning::item title='+(item.findtext('title') or '')[:100]+' has_link='+str(bool(item.findtext('link'))),flush=True)
          except Exception as exc:
              print(f'::error::RSS failed type={type(exc).__name__} status={getattr(exc,"code","none")}',flush=True)
              raise
          PY
