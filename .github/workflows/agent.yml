name: Gemini API diagnosis
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnostic only, no Telegram delivery
        required: true
        type: choice
        options: [alert, briefing]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Offline regression
        run: python -m pytest tests/test_brain.py tests/test_diagnose_rest.py -q
      - name: Direct REST request and response diagnostics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIAGNOSTIC_MODEL: gemini-3.1-flash-lite
        run: python -m scripts.diagnose_gemini_rest
