name: Phase 7 read-only provider probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase7-probe-${{ github.repository }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Probe RSS and Gemini without delivery
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m scripts.phase7_probe
